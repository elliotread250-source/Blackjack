<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<meta name="description" content="Dino Run: a faithful remake of Chrome's offline T-Rex runner. Jump the cacti, duck the pterodactyls, run through the night.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dino Run</title>
<link rel="icon" href="icon.svg">
<style>
  :root { --bg: #f7f7f7; --fg: #535353; --soft: #757575; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    position: fixed; inset: 0; color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #screen {
    position: absolute; left: 0; top: 0; display: block; background: var(--bg);
    image-rendering: crisp-edges; image-rendering: pixelated;
  }
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #arcade {
    position: absolute; z-index: 3; left: 10px; top: 10px; padding: 8px 10px;
    left: max(10px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px));
    color: var(--soft); font-size: 13px; line-height: 1; letter-spacing: .04em; text-decoration: none;
    opacity: .75; border-radius: 6px; white-space: nowrap; display: none;
  }
  #arcade:hover, #arcade:focus-visible { opacity: 1; color: var(--fg); outline: 1px solid var(--soft); }
  body.st-waiting #arcade, body.st-crashed #arcade { display: block; }
  #bar {
    position: absolute; z-index: 3; top: 10px; right: 10px; display: flex; gap: 8px;
    top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  }
  .btn {
    width: 34px; height: 34px; padding: 0; margin: 0; border-radius: 50%;
    border: 1.5px solid var(--soft); background: transparent; color: var(--fg);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: .5; touch-action: manipulation; transition: opacity .15s;
  }
  .btn:hover, .btn:focus-visible { opacity: 1; outline: none; }
  .btn svg { width: 18px; height: 18px; display: block; }
  #btn-mute .off, #btn-mute[aria-pressed="true"] .on { display: none; }
  #btn-mute[aria-pressed="true"] .off { display: block; }
  #btn-pause { display: none; }
  body.touch #btn-pause { display: flex; }
  body.touch .btn { width: 40px; height: 40px; }
  #below {
    position: absolute; z-index: 2; left: 0; top: 0; text-align: center; pointer-events: none;
    font-size: 14px; line-height: 1.45; color: var(--soft);
  }
  #below p { margin: 0 12px; }
  #stats { color: var(--fg); font-variant-numeric: tabular-nums; margin-bottom: 4px !important; min-height: 1.45em; }
  #stats b { font-weight: 600; }
  #hint .keys { font-size: 12.5px; opacity: .85; }
  kbd {
    font: inherit; font-size: .9em; padding: 0 5px; border: 1px solid var(--soft); border-bottom-width: 2px;
    border-radius: 4px;
  }
  #duck {
    position: absolute; z-index: 3; display: none; width: 76px; height: 76px; padding: 0;
    left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
    border: 2px solid var(--soft); border-radius: 18px; background: transparent; color: var(--fg);
    opacity: .55; touch-action: none; align-items: center; justify-content: center;
  }
  #duck svg { width: 34px; height: 34px; }
  #duck.down { opacity: .9; background: color-mix(in srgb, var(--soft) 25%, transparent); }
  body.touch.st-playing #duck, body.touch.st-starting #duck { display: flex; }
  body.paused #duck { display: none; }
  #rotate {
    position: absolute; z-index: 2; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom, 0px));
    margin: 0; text-align: center; font-size: 14px; color: var(--soft); display: none; pointer-events: none;
  }
  #rotate svg { width: 26px; height: 26px; display: block; margin: 0 auto 6px; }
  body.touch.portrait #rotate { display: block; }
  body.touch.portrait.st-playing #rotate { opacity: .6; }
  body.touch.portrait.st-playing #rotate { bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 96px); }
  noscript { position: absolute; top: 40%; width: 100%; text-align: center; color: #535353; }
</style>
</head>
<body class="st-waiting">
<canvas id="screen" width="600" height="150" aria-label="Dino Run game"></canvas>
<div id="safe"></div>
<a id="arcade" href="https://open-arcade.up.railway.app">&larr; Arcade</a>
<div id="bar">
  <button id="btn-palette" class="btn" type="button" aria-label="Switch colours" title="Classic grey / colour (C)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7.2"/><path d="M10 2.8v14.4" /><path d="M10 2.8a7.2 7.2 0 0 1 0 14.4z" fill="currentColor"/></svg>
  </button>
  <button id="btn-mute" class="btn" type="button" aria-label="Mute" aria-pressed="false" title="Sound (M)">
    <svg class="on" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.5 5a7 7 0 0 1 0 10"/></svg>
    <svg class="off" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.5l5 5M18 7.5l-5 5"/></svg>
  </button>
  <button id="btn-pause" class="btn" type="button" aria-label="Pause" title="Pause (P)">
    <svg viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3.4" height="12" rx="1"/><rect x="11.6" y="4" width="3.4" height="12" rx="1"/></svg>
  </button>
</div>
<div id="below"><p id="stats"></p><p id="hint"></p></div>
<button id="duck" type="button" aria-label="Duck">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l7 7 7-7"/></svg>
</button>
<p id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="17" rx="2"/><path d="M3.5 13.5a8.5 8.5 0 0 0 6 7.5M3 18.5l.5 2.6 2.6-.6"/></svg>
  Rotate your phone for a bigger view
</p>
<noscript>Dino Run needs JavaScript.</noscript>
<script src="js/core.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
