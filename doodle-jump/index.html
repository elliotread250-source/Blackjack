<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e2">
<meta name="description" content="Doodle Jump: bounce up an endless sheet of graph paper. Springs, propeller hats, jetpacks, monsters, black holes and UFOs. Tilt or touch on phones, arrow keys on desktop.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Doodle Jump</title>
<link rel="icon" href="icon.svg">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #e8e1cc;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    position: fixed; inset: 0;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Comic Neue', cursive, system-ui, sans-serif;
    background-color: #e8e1cc;
    background-image:
      linear-gradient(rgba(96,140,205,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96,140,205,.12) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  #game { position: absolute; left: 0; top: 0; display: block; background: #f7f2e2; touch-action: none; }
  body.framed #game { box-shadow: 0 0 0 1px rgba(80,60,20,.18), 0 10px 40px rgba(60,40,10,.22); }
  #arcade {
    position: absolute; z-index: 3; display: none; padding: 6px 9px;
    color: #6a6252; font-size: 14px; line-height: 1; text-decoration: none; white-space: nowrap;
    opacity: .7; border-radius: 6px; font-weight: bold;
  }
  #arcade:hover, #arcade:focus-visible { opacity: 1; color: #2b2620; outline: 1.5px dashed #6a6252; }
  body.show-arcade #arcade { display: block; }
  noscript { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #2b2620; }
</style>
</head>
<body>
<canvas id="game" aria-label="Doodle Jump game"></canvas>
<a id="arcade" href="https://open-arcade.up.railway.app">&larr; Arcade</a>
<noscript>Doodle Jump needs JavaScript.</noscript>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
