<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd6f0">
<meta name="description" content="Crossy Road in your browser: hop across endless voxel roads, rivers and train tracks, dodge traffic, ride logs, outrun the eagle and unlock ten characters.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Crossy Road</title>
<link rel="icon" href="icon.svg">
<style>
  :root {
    --text: #ffffff;
    --ink: #1d2433;
    --shadow: rgba(18, 24, 40, 0.55);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #9fd6f0; color: var(--text); font-family: var(--font);
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  [hidden] { display: none !important; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  :focus-visible { outline: 3px solid #ffe14d; outline-offset: 3px; }
  .outline { text-shadow: 0 3px 0 var(--shadow), 2px 0 0 var(--shadow), -2px 0 0 var(--shadow), 0 -2px 0 var(--shadow), 0 2px 0 var(--shadow); }

  /* screens sit over the canvas; empty space passes taps through to the game */
  .screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--safe-t) + 16px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 18px) calc(var(--safe-l) + 16px);
    pointer-events: none; }
  .screen > * { pointer-events: auto; }
  .screen .pass { pointer-events: none; }
  .dim { background: rgba(16, 22, 40, 0.45); pointer-events: auto; }

  .arcade { position: fixed; left: calc(var(--safe-l) + 12px); top: calc(var(--safe-t) + 10px); z-index: 30; color: #fff;
    text-decoration: none; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 10px; background: rgba(20, 28, 48, 0.32); }
  .arcade:hover { background: rgba(20, 28, 48, 0.5); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 13px 22px;
    font-weight: 900; font-size: 18px; letter-spacing: 0.5px; text-transform: uppercase; color: #fff;
    background: #3fb3f0; box-shadow: 0 5px 0 #1f7fb8, 0 9px 18px rgba(0, 0, 0, 0.22); transition: transform .06s, box-shadow .06s;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.22); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1f7fb8, 0 3px 8px rgba(0, 0, 0, 0.2); }
  .btn.green { background: #5ccf3e; box-shadow: 0 5px 0 #3a9324, 0 9px 18px rgba(0, 0, 0, 0.22); }
  .btn.green:active { box-shadow: 0 1px 0 #3a9324; }
  .btn.orange { background: #ff9f1c; box-shadow: 0 5px 0 #c26f00, 0 9px 18px rgba(0, 0, 0, 0.22); }
  .btn.orange:active { box-shadow: 0 1px 0 #c26f00; }
  .btn[disabled] { background: #9aa3b2; box-shadow: 0 5px 0 #6c7484; cursor: default; opacity: 0.85; }
  .btn.round { width: 54px; height: 54px; padding: 0; border-radius: 16px; }
  .btn svg { width: 26px; height: 26px; fill: currentColor; }

  /* title */
  #s-title { justify-content: space-between; }
  .logo { margin-top: max(9vh, 56px); text-align: center; line-height: 0.86; font-weight: 900; letter-spacing: 1px; transform: rotate(-4deg);
    animation: bob 2.4s ease-in-out infinite; }
  .logo span { display: block; font-size: clamp(54px, 15vw, 112px); color: #fff;
    text-shadow: 0 2px 0 #d9d9d9, 0 4px 0 #2c3448, 0 6px 0 #2c3448, 0 8px 0 #2c3448, 0 10px 0 #2c3448, 0 16px 18px rgba(0, 0, 0, 0.3),
      3px 0 0 #2c3448, -3px 0 0 #2c3448, 0 -3px 0 #2c3448; }
  .logo span:last-child { color: #ffd23f; margin-left: 0.4em; }
  @keyframes bob { 50% { transform: rotate(-4deg) translateY(-6px); } }
  .tap { font-size: clamp(20px, 5vw, 28px); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; transform: scale(0.96); } }
  .title-bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .title-best { font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .keys { font-size: 12.5px; font-weight: 700; opacity: 0.9; text-align: center; max-width: 320px; line-height: 1.4; }

  /* HUD */
  #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  #hud .score { position: absolute; left: calc(var(--safe-l) + 16px); top: calc(var(--safe-t) + 8px); font-weight: 900; }
  #score { font-size: 54px; line-height: 1; }
  #top { font-size: 15px; font-weight: 900; letter-spacing: 1px; margin-top: 2px; }
  #hud .right { position: absolute; right: calc(var(--safe-r) + 14px); top: calc(var(--safe-t) + 12px); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .coins { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 26px; }
  .coins.pop { animation: pop .25s ease-out; }
  @keyframes pop { 40% { transform: scale(1.25); } }
  .coin-ic { width: 22px; height: 22px; border-radius: 4px; background: #ffc928; box-shadow: inset 0 0 0 4px #ffe27a, inset 0 0 0 7px #ffc928, 0 3px 0 #b88a00, 0 0 0 2px rgba(18, 24, 40, 0.55); display: inline-block; flex: none; }
  .hud-btns { display: flex; gap: 8px; pointer-events: auto; }
  .ibtn { width: 42px; height: 42px; border-radius: 12px; background: rgba(20, 28, 48, 0.32); display: grid; place-items: center; }
  .ibtn svg { width: 22px; height: 22px; fill: #fff; }
  .ibtn:active { transform: scale(0.94); }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 26px); text-align: center; font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.95; }

  /* pause */
  #s-pause { justify-content: center; gap: 18px; }
  #s-pause h2 { font-size: 46px; font-weight: 900; margin: 0 0 8px; text-transform: uppercase; }

  /* game over */
  #s-over { justify-content: center; background: radial-gradient(ellipse at 50% 50%, rgba(16, 22, 40, 0.38), rgba(16, 22, 40, 0) 65%); }
  #hud.over .score { display: none; }
  .over-card { display: flex; flex-direction: column; align-items: center; gap: 10px; animation: rise .35s ease-out; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
  .why { font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .big { font-size: 96px; font-weight: 900; line-height: 1; }
  .sub { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .badge { background: #ff4f6d; color: #fff; padding: 6px 14px; border-radius: 10px; font-weight: 900; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; transform: rotate(-3deg); box-shadow: 0 4px 0 #b52a43; animation: wiggle 0.9s ease-in-out infinite; }
  @keyframes wiggle { 50% { transform: rotate(3deg) scale(1.06); } }
  .over-btns { margin-top: 22px; display: flex; gap: 14px; align-items: center; }
  .over-btns .btn.green { font-size: 24px; padding: 16px 34px; }
  .run-coins { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; }

  /* characters */
  #s-chars { justify-content: space-between; }
  .chars-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .chars-top h2 { margin: 0; font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .chars-bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(420px, 100%); }
  .cname { font-size: 34px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .cinfo { font-size: 15px; font-weight: 800; min-height: 20px; text-align: center; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 9px; height: 9px; border-radius: 3px; background: rgba(255, 255, 255, 0.45); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .dots i.on { background: #fff; transform: scale(1.3); }
  .dots i.lock { background: rgba(30, 34, 50, 0.45); }
  .dots i.lock.on { background: #2b3045; }
  .chars-row { display: flex; gap: 12px; align-items: center; width: 100%; justify-content: center; }
  #c-action { min-width: 190px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="game"></canvas>
<a class="arcade" id="arcade" href="https://open-arcade.up.railway.app">&larr; Arcade</a>

<div id="hud" hidden>
  <div class="score outline"><div id="score">0</div><div id="top">Top 0</div></div>
  <div class="right">
    <div class="coins outline" id="coinbox"><span class="coin-ic"></span><span id="coins">0</span></div>
    <div class="hud-btns">
      <button class="ibtn" id="b-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button class="ibtn mute" aria-label="Mute"></button>
    </div>
  </div>
  <div id="hint" class="outline" hidden></div>
</div>

<div id="s-title" class="screen">
  <div class="logo pass"><span>Crossy</span><span>Road</span></div>
  <div class="tap outline pass" id="tap">Tap to play</div>
  <div class="title-bottom">
    <div class="title-best outline pass" id="t-best">Best 0</div>
    <div class="row">
      <button class="btn orange" id="t-chars"><svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4.4 0 8 2 8 4.5V21H4v-3.5C4 15 7.6 13 12 13z"/></svg>Characters</button>
      <button class="btn round mute" aria-label="Mute"></button>
    </div>
    <div class="keys outline pass" id="t-keys"></div>
  </div>
</div>

<div id="s-pause" class="screen dim" hidden>
  <h2 class="outline">Paused</h2>
  <button class="btn green" id="p-resume">Resume</button>
  <button class="btn" id="p-menu">Menu</button>
</div>

<div id="s-over" class="screen" hidden>
  <div class="over-card">
    <div class="why outline" id="o-why">Splat!</div>
    <div class="big outline" id="o-score">0</div>
    <div class="badge" id="o-new" hidden>New best!</div>
    <div class="sub outline" id="o-best">Best 0</div>
    <div class="run-coins outline"><span class="coin-ic"></span><span id="o-coins">+0</span></div>
    <div class="over-btns">
      <button class="btn orange round" id="o-chars" aria-label="Characters"><svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4.4 0 8 2 8 4.5V21H4v-3.5C4 15 7.6 13 12 13z"/></svg></button>
      <button class="btn green" id="o-retry"><svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>Retry</button>
      <button class="btn round mute" aria-label="Mute"></button>
    </div>
  </div>
</div>

<div id="s-chars" class="screen" hidden>
  <div class="chars-top">
    <button class="btn round" id="c-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15.4 4.6a1.5 1.5 0 0 1 0 2.1L10.1 12l5.3 5.3a1.5 1.5 0 1 1-2.1 2.1l-6.4-6.4a1.5 1.5 0 0 1 0-2.1l6.4-6.4a1.5 1.5 0 0 1 2.1 0z"/></svg></button>
    <h2 class="outline">Characters</h2>
    <div class="coins outline"><span class="coin-ic"></span><span id="c-coins">0</span></div>
  </div>
  <div class="chars-bottom">
    <div class="cname outline" id="c-name">Chicken</div>
    <div class="cinfo outline" id="c-info"></div>
    <div class="dots" id="c-dots"></div>
    <div class="chars-row">
      <button class="btn round" id="c-prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15.4 4.6a1.5 1.5 0 0 1 0 2.1L10.1 12l5.3 5.3a1.5 1.5 0 1 1-2.1 2.1l-6.4-6.4a1.5 1.5 0 0 1 0-2.1l6.4-6.4a1.5 1.5 0 0 1 2.1 0z"/></svg></button>
      <button class="btn green" id="c-action">Select</button>
      <button class="btn round" id="c-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M8.6 19.4a1.5 1.5 0 0 1 0-2.1l5.3-5.3-5.3-5.3a1.5 1.5 0 1 1 2.1-2.1l6.4 6.4a1.5 1.5 0 0 1 0 2.1l-6.4 6.4a1.5 1.5 0 0 1-2.1 0z"/></svg></button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
