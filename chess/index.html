<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<title>Chess</title>
<meta name="description" content="Play chess against the computer on Easy, Medium or Hard, against a friend on the same device, or online with a room code or quick match.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="play">
    <div class="player top"><span class="name" id="name-top">Computer</span><span class="caps" id="caps-top"></span></div>
    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Chess board"></div>
      <div id="promo" class="promo" hidden></div>
    </div>
    <div class="player bottom"><span class="name" id="name-bottom">You</span><span class="caps" id="caps-bottom"></span></div>
  </section>

  <aside class="side">
    <h1>♞ Chess</h1>
    <p id="status" class="status" role="status" aria-live="polite">White to move</p>
    <div class="seg" role="radiogroup" aria-label="Opponent">
      <button data-mode="bot" role="radio">vs Computer</button>
      <button data-mode="friend" role="radio">2 Players</button>
      <button data-mode="online" role="radio">Online</button>
    </div>
    <div class="online" id="online" hidden>
      <div id="ol-lobby">
        <label class="ol-name">Your name <input id="ol-name" maxlength="14" autocomplete="nickname" placeholder="Player"></label>
        <div class="row"><button id="ol-create" class="primary">Create room</button><button id="ol-quick">Quick match</button></div>
        <form id="ol-join" class="row ol-joinrow"><input id="ol-code" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" aria-label="Room code"><button>Join</button></form>
      </div>
      <div id="ol-wait" hidden>
        <p class="ol-label" id="ol-wait-label">Room code — send it to a friend</p>
        <p class="ol-code" id="ol-code-show"></p>
        <div class="row"><button id="ol-copy">Copy invite link</button><button id="ol-cancel">Cancel</button></div>
      </div>
      <div id="ol-game" hidden>
        <div class="row" id="ol-drawreq" hidden><span class="ol-label">Draw offered</span><button id="ol-accept" class="primary">Accept</button><button id="ol-decline">Decline</button></div>
        <div class="row"><button id="ol-draw">Offer draw</button><button id="ol-resign">Resign</button><button id="ol-rematch" class="primary" hidden>Rematch</button><button id="ol-leave">Leave</button></div>
      </div>
      <p class="ol-info" id="ol-info" role="status" aria-live="polite"></p>
    </div>
    <div class="row bot-only">
      <label>Level <select id="level"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
      <label>Play as <select id="side"><option value="w">White</option><option value="b">Black</option></select></label>
    </div>
    <div class="row">
      <button id="new" class="primary">New game</button>
      <button id="undo">Undo</button>
      <button id="flip" title="Flip board">⇅ Flip</button>
      <button id="mute" aria-label="Mute">🔊</button>
    </div>
    <ol id="moves" class="moves" aria-label="Moves"></ol>
  </aside>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
