<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0f2c">
<title>Geometry Dash Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f2c;
    --panel: rgba(8, 12, 40, 0.86);
    --ink: #ffffff;
    --muted: #b9c2ff;
    --accent: #7dff3a;
    --accent2: #3af0ff;
    --gold: #ffd21f;
    --danger: #ff3b5c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--ink); font-family: 'Lilita One', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; padding: 16px; z-index: 5;
  }
  .overlay.show { display: flex; }
  .shade { background: rgba(4, 6, 24, 0.55); backdrop-filter: blur(3px); }
  h1 {
    margin: 0 0 4px; font-size: clamp(34px, 7vw, 72px); letter-spacing: 1px; text-align: center;
    color: #fff; -webkit-text-stroke: 3px #000; paint-order: stroke fill;
    text-shadow: 0 5px 0 #000, 0 0 30px rgba(58, 240, 255, 0.5);
  }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: clamp(14px, 2.4vw, 18px); text-align: center; }
  .levels {
    display: grid; grid-template-columns: repeat(3, minmax(0, 260px)); gap: 16px;
    width: 100%; justify-content: center;
  }
  .card {
    background: var(--panel); border: 3px solid #000; border-radius: 14px; padding: 16px;
    box-shadow: 0 6px 0 #000, inset 0 0 0 2px rgba(255,255,255,0.08);
    display: flex; flex-direction: column; gap: 10px;
  }
  .card .top { display: flex; align-items: center; gap: 12px; }
  .face {
    width: 52px; height: 52px; border-radius: 50%; border: 3px solid #000; flex: none;
    display: grid; place-items: center; font-size: 13px; color: #000; position: relative;
  }
  .face::before, .face::after {
    content: ''; position: absolute; top: 15px; width: 8px; height: 10px; background: #000; border-radius: 3px;
  }
  .face::before { left: 12px; } .face::after { right: 12px; }
  .name { font-size: 22px; line-height: 1.05; -webkit-text-stroke: 1px #000; }
  .meta { color: var(--muted); font-size: 14px; }
  .star { color: var(--gold); }
  .bar { height: 14px; border-radius: 7px; background: #000; border: 2px solid #000; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar.p i { background: var(--accent2); }
  .barlabel { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: -6px; }
  .btns { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 18px; color: #fff; cursor: pointer; flex: 1;
    background: linear-gradient(#59e01c, #2f9a0c); border: 3px solid #000; border-radius: 10px;
    padding: 8px 12px; box-shadow: 0 4px 0 #000; -webkit-text-stroke: 1px #000;
    transition: transform 0.06s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
  button.alt { background: linear-gradient(#3ad6ff, #1180c0); }
  button.ghost { background: linear-gradient(#5a5f8f, #343866); }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .help { margin-top: 20px; color: var(--muted); font-size: 14px; text-align: center; line-height: 1.6; }
  kbd {
    font-family: inherit; background: #000; color: #fff; padding: 1px 7px; border-radius: 5px; font-size: 13px;
  }
  .panel {
    background: var(--panel); border: 3px solid #000; border-radius: 16px; padding: 22px 26px;
    box-shadow: 0 6px 0 #000; display: flex; flex-direction: column; gap: 12px; min-width: min(320px, 100%);
    align-items: stretch; text-align: center;
  }
  .panel h2 { margin: 0; font-size: 34px; -webkit-text-stroke: 2px #000; paint-order: stroke fill; }
  .stats { color: var(--muted); font-size: 16px; line-height: 1.6; }
  .hud {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 4; display: none; gap: 8px;
  }
  .hud.show { display: flex; }
  .hud button { flex: none; font-size: 15px; padding: 6px 12px; }
  #cpbtns { display: none; gap: 8px; }
  #cpbtns.show { display: flex; }
  .toggle { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .toggle button { flex: none; font-size: 15px; padding: 6px 14px; }
  @media (max-width: 760px) {
    .levels { grid-template-columns: minmax(0, 360px); gap: 10px; }
    .card { padding: 12px; gap: 8px; }
    .overlay#menu { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
    .help { display: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud" id="hud">
  <button class="ghost" id="pauseBtn" aria-label="Pause">II</button>
  <div id="cpbtns">
    <button class="alt" id="cpAdd" aria-label="Place checkpoint">+ Checkpoint</button>
    <button class="ghost" id="cpDel" aria-label="Remove checkpoint">Remove</button>
  </div>
</div>

<div class="overlay show shade" id="menu">
  <h1>GEOMETRY DASH</h1>
  <p class="sub">Replica &middot; 8 game modes &middot; 3 levels</p>
  <div class="levels" id="levels"></div>
  <div class="toggle">
    <button class="ghost" id="musicBtn">Music: On</button>
    <button class="ghost" id="fpsBtn">FPS: Off</button>
  </div>
  <div class="help">
    Jump / fly: <kbd>Space</kbd> <kbd>&uarr;</kbd> <kbd>W</kbd> click or tap &middot; Pause <kbd>Esc</kbd><br>
    Practice: <kbd>Z</kbd> place checkpoint &middot; <kbd>X</kbd> remove checkpoint &middot; Restart <kbd>R</kbd>
  </div>
</div>

<div class="overlay shade" id="pause">
  <div class="panel">
    <h2 id="pauseTitle">Paused</h2>
    <div class="stats" id="pauseStats"></div>
    <button id="resumeBtn">Resume</button>
    <button class="alt" id="practiceBtn">Practice Mode</button>
    <button class="ghost" id="restartBtn">Restart</button>
    <button class="ghost" id="menuBtn">Menu</button>
  </div>
</div>

<div class="overlay shade" id="complete">
  <div class="panel">
    <h2>Level Complete!</h2>
    <div class="stats" id="completeStats"></div>
    <button id="againBtn">Play Again</button>
    <button class="ghost" id="menuBtn2">Menu</button>
  </div>
</div>

<script src="js/physics.js"></script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
