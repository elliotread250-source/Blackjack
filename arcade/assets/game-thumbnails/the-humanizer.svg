8" fill="#ff5c7a" opacity=".12" rx="3"/><text x="52" y="156" font-size="12.5" fill="#6f7886" font-family="'JetBrains Mono',Menlo,Consolas,monospace">to note that leveraging</text><text x="52" y="178" font-size="12.5" fill="#6f7886" font-family="'JetBrains Mono',Menlo,Consolas,monospace">synergies can unlock</text><text x="52" y="200" font-size="12.5" fill="#6f7886" font-family="'JetBrains Mono',Menlo,Consolas,monospace">unprecedented value.</text><rect x="50" y="187" width="148" height="18" fill="#ff5c7a" opacity=".12" rx="3"/><text x="52" y="222" font-size="12.5" fill="#6f7886" font-family="'JetBrains Mono',Menlo,Consolas,monospace">Furthermore, in</text><text x="52" y="244" font-size="12.5" fill="#6f7886" font-family="'JetBrains Mono',Menlo,Consolas,monospace">conclusion, it is</text><text x="52" y="266" font-size="12.5" fill="#6f7886" font-family="'JetBrains Mono',Menlo,Consolas,monospace">crucial to delve…</text><rect x="50" y="253" width="125.8" height="18" fill="#ff5c7a" opacity=".12" rx="3"/><text x="52" y="100" font-size="9" fill="#3a4450" font-family="'JetBrains Mono',Menlo,Consolas,monospace">01</text><text x="372" y="110" font-size="17" fill="#f4ead8" font-family="Georgia,serif" font-style="italic">Honestly? Working</text><text x="372" y="136" font-size="17" fill="#f4ead8" font-family="Georgia,serif" font-style="normal">together just gets</text><text x="372" y="162" font-size="17" fill="#f4ead8" font-family="Georgia,serif" font-style="normal">more done — and it</text><text x="372" y="188" font-size="17" fill="#f4ead8" font-family="Georgia,serif" font-style="normal">shows. We tried it on</text><text x="372" y="214" font-size="17" fill="#f4ead8" font-family="Georgia,serif" font-style="normal">the last two projects</text><text x="372" y="240" font-size="17" fill="#f4ead8" font-family="Georgia,serif" font-style="normal">and it paid off.</text><rect x="509.6" y="241" width="9" height="20" fill="#ff7518"/><circle cx="318" cy="180" r="46" fill="#ff7518" opacity=