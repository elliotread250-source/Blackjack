<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.bk{animation:br 2.2s steps(1) infinite}.pc{animation:fly 2.2s ease-out infinite}@keyframes br{0%,45%{opacity:1}46%,100%{opacity:0}}@keyframes fly{0%,45%{opacity:0;transform:none}46%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(160deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#7fc8f0"/><rect y="104" width="204" height="32" fill="#5a9e3a"/><g class="bk"><rect x="82" y="64" width="40" height="40" fill="#8b5a2b"/><rect x="82" y="64" width="40" height="10" fill="#5aa83a"/></g><rect class="pc f" style="--x:-40px;--y:-30px" x="92" y="74" width="12" height="12" fill="#8b5a2b"/><rect class="pc f" style="--x:40px;--y:-36px" x="104" y="74" width="12" height="12" fill="#8b5a2b"/><rect class="pc f" style="--x:-30px;--y:20px" x="92" y="86" width="12" height="12" fill="#8b5a2b"/><rect class="pc f" style="--x:36px;--y:24px" x="104" y="86" width="12" height="12" fill="#8b5a2b"/></g></g></svg>
