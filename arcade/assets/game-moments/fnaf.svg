<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.bm{animation:sweep 3s ease-in-out infinite}.ey{animation:eyes 3s steps(1) infinite}.ck{animation:ck 3s steps(1) infinite}.ck2{animation:ck2 3s steps(1) infinite}
    @keyframes sweep{0%{transform:translateX(-120px)}45%,60%{transform:translateX(0)}100%{transform:translateX(130px)}}@keyframes eyes{0%,38%{opacity:0}39%,70%{opacity:1}71%,100%{opacity:0}}@keyframes ck{0%,79%{opacity:1}80%,100%{opacity:0}}@keyframes ck2{0%,79%{opacity:0}80%,100%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#070304"/><rect x="62" y="16" width="80" height="104" fill="#000" stroke="#4a2c1e" stroke-width="4"/><g class="ey"><ellipse cx="88" cy="58" rx="6" ry="4" fill="#fff4d0"/><ellipse cx="116" cy="58" rx="6" ry="4" fill="#fff4d0"/><circle cx="88" cy="58" r="2" fill="#c41e1e"/><circle cx="116" cy="58" r="2" fill="#c41e1e"/></g><ellipse class="bm" cx="102" cy="64" rx="34" ry="44" fill="#fff1c8" opacity=".14"/><text class="ck" x="196" y="20" text-anchor="end" font-family="monospace" font-weight="700" font-size="14" fill="#f2f5fa">5 AM</text><text class="ck2" x="196" y="20" text-anchor="end" font-family="monospace" font-weight="700" font-size="14" fill="#ffd08a">6 AM</text></g></g></svg>
