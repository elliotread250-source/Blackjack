<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.k{animation:kart 2s ease-in-out infinite}.sk{animation:skid 2s ease-in-out infinite}.fl{animation:fl .12s steps(2) infinite}
    @keyframes kart{0%{transform:translate(-60px,20px) rotate(-10deg)}50%{transform:translate(70px,0) rotate(18deg)}100%{transform:translate(220px,-10px) rotate(0)}}@keyframes skid{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@keyframes fl{50%{transform:scaleX(1.6)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#3b4250"/><path class="sk" d="M0 104 Q90 80 204 90" stroke="#080b10" stroke-width="4" fill="none" stroke-dasharray="200" opacity=".6"/><g class="k"><rect x="20" y="70" width="46" height="20" rx="6" fill="#e33b2e"/><rect x="34" y="62" width="16" height="10" rx="3" fill="#ffd08a"/><circle cx="28" cy="92" r="6" fill="#080b10"/><circle cx="58" cy="92" r="6" fill="#080b10"/><path class="fl f" d="M20 76 L4 80 L20 84Z" fill="#ffb347"/></g></g></g></svg>
