<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.bird{animation:flap 1.4s ease-in-out infinite}.w{animation:wing .2s steps(2) infinite}@keyframes flap{0%,100%{transform:translate(0,14px)}50%{transform:translate(70px,-14px)}}@keyframes wing{50%{transform:scaleY(-1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#4ec0ca"/><rect x="120" y="0" width="30" height="44" fill="#5ab934" stroke="#080b10" stroke-width="2"/><rect x="120" y="94" width="30" height="42" fill="#5ab934" stroke="#080b10" stroke-width="2"/><g class="bird"><rect x="40" y="58" width="26" height="20" rx="8" fill="#ffd21f" stroke="#080b10" stroke-width="2"/><rect class="w f" x="38" y="66" width="12" height="6" rx="3" fill="#f2f5fa" stroke="#080b10"/><rect x="62" y="68" width="10" height="5" fill="#ff7518"/></g></g></g></svg>
