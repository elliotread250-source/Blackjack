<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.cube{animation:gd 1.1s cubic-bezier(.4,0,.6,1) infinite}@keyframes gd{0%{transform:translate(-40px,0) rotate(0)}50%{transform:translate(40px,-40px) rotate(45deg)}100%{transform:translate(120px,0) rotate(90deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#1b2bb8"/><rect y="102" width="204" height="34" fill="#0d1670"/><path d="M110 102 L122 82 L134 102Z" fill="#ff3ec8"/><rect class="cube f" x="40" y="78" width="24" height="24" fill="#ffd21f" stroke="#080b10" stroke-width="2"/></g></g></svg>
