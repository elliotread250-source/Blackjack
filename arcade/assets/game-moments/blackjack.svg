<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.c1{animation:deal 2.4s ease-out infinite}.c2{animation:deal 2.4s .25s ease-out infinite}.w{animation:win 2.4s ease-out infinite}
    @keyframes deal{0%{transform:translate(60px,-90px) rotate(-30deg);opacity:0}25%,100%{transform:none;opacity:1}}@keyframes win{0%,50%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.25)}70%,100%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#0d3a26" opacity=".7"/><g class="c1"><g transform="translate(50 44)"><rect width="40" height="56" rx="5" fill="#f2f5fa"/><text x="7" y="20" font-family="Georgia,serif" font-weight="700" font-size="16" fill="#080b10">A</text></g></g><g class="c2"><g transform="translate(98 44)"><rect width="40" height="56" rx="5" fill="#f2f5fa"/><text x="7" y="20" font-family="Georgia,serif" font-weight="700" font-size="16" fill="#d22">K</text></g></g><text class="w f" x="102" y="124" text-anchor="middle" font-family="monospace" font-weight="700" font-size="16" fill="#ffd08a">21!</text></g></g></svg>
