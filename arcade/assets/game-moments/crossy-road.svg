<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.ch{animation:hop .9s ease-out infinite}.car{animation:car 1.8s linear infinite}@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22px) scaleY(1.08)}60%{transform:translateY(-34px)}100%{transform:translateY(-34px)}}@keyframes car{from{transform:translateX(-80px)}to{transform:translateX(240px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#5fbf3a"/><rect y="40" width="204" height="40" fill="#3b4250"/><path d="M0 60 H204" stroke="#f2f5fa" stroke-dasharray="12 10" stroke-width="2"/><g class="car"><rect x="0" y="44" width="44" height="18" rx="4" fill="#e33b2e"/><rect x="10" y="40" width="20" height="8" fill="#8fd3ff"/></g><g class="ch b"><rect x="92" y="96" width="20" height="20" fill="#f2f5fa"/><rect x="106" y="90" width="9" height="10" fill="#f2f5fa"/><rect x="108" y="86" width="5" height="5" fill="#e8322c"/><rect x="115" y="94" width="5" height="3" fill="#ff9a1a"/></g></g></g></svg>
