<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.sl{stroke-dasharray:180;animation:sl 1.6s ease-out infinite}.l{animation:hl 1.6s ease-in infinite}.r{animation:hr 1.6s ease-in infinite}
    @keyframes sl{0%,20%{stroke-dashoffset:180;opacity:1}45%{stroke-dashoffset:0;opacity:1}70%,100%{opacity:0}}@keyframes hl{0%,40%{transform:none}100%{transform:translate(-30px,40px) rotate(-30deg)}}@keyframes hr{0%,40%{transform:none}100%{transform:translate(30px,44px) rotate(30deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#3b2412"/><path class="l f" d="M102 34 a30 30 0 0 0 0 60z" fill="#3fa34d"/><path class="l f" d="M102 40 a24 24 0 0 0 0 48z" fill="#ff4d4d"/><path class="r f" d="M102 34 a30 30 0 0 1 0 60z" fill="#3fa34d"/><path class="r f" d="M102 40 a24 24 0 0 1 0 48z" fill="#ff4d4d"/><path class="sl" d="M40 120 L170 14" stroke="#f2f5fa" stroke-width="4" stroke-linecap="round"/></g></g></svg>
