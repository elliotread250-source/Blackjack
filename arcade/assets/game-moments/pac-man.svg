<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.pm{animation:mv 2.4s linear infinite}.mo{animation:ch .25s steps(2) infinite}.dt{animation:eat 2.4s steps(1) infinite}
