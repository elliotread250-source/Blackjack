<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.ball{animation:bb 1.6s linear infinite}.br{animation:sh 1.6s steps(1) infinite}@keyframes bb{0%{transform:translate(0,0)}50%{transform:translate(40px,-74px)}100%{transform:translate(80px,0)}}@keyframes sh{0%,49%{opacity:1}50%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect width="204" height="136" fill="#0a0f2a"/><rect x="20" y="18" width="38" height="12" rx="2" fill="#ff4d4d"/><rect x="62" y="18" width="38" height="12" rx="2" fill="#ffb347"/><rect x="104" y="18" width="38" height="12" rx="2" fill="#ffd21f"/><rect x="146" y="18" width="38" height="12" rx="2" fill="#3fbcff"/><rect class="br" x="104" y="34" width="38" height="12" rx="2" fill="#48d6a1"/><rect x="70" y="118" width="54" height="8" rx="4" fill="#f2f5fa"/><circle class="ball" cx="82" cy="110" r="5" fill="#f2f5fa"/></g></g></svg>
