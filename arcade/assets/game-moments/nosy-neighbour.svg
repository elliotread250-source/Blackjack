<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.dr{animation:creak 3s ease-in-out infinite;transform-origin:72px 70px}.ey{animation:peek 3s ease-in-out infinite}.bl{animation:blink 3s steps(1) infinite}
