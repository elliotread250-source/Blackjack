<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><style>.pip{fill:rgba(8,11,16,.86);stroke:#ff7518;stroke-opacity:.65;stroke-width:2}.f{transform-box:fill-box;transform-origin:center}.b{transform-box:fill-box;transform-origin:50% 100%}.ball{animation:roll 2.2s cubic-bezier(.3,.6,.4,1) infinite}@keyframes roll{0%{transform:translate(0,0)}70%{transform:translate(118px,-58px) scale(1)}85%,100%{transform:translate(124px,-62px) scale(0);}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(418 108)"><rect class="pip" width="204" height="136" rx="16"/><clipPath id="c"><rect width="204" height="136" rx="16"/></clipPath><g clip-path="url(#c)"><rect x="10" y="10" width="184" height="116" rx="12" fill="#1f7a43"/><circle cx="174" cy="24" r="10" fill="#080b10"/><circle class="ball f" cx="50" cy="88" r="9" fill="#ffd21f" stroke="#080b10" stroke-width="1"/><circle cx="44" cy="96" r="9" fill="#f2f5fa"/></g></g></svg>
