<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="description" content="Pac-Man: a faithful remake of Namco's 1980 arcade game, playable in the browser with keyboard, swipes or an on-screen d-pad.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pac-Man</title>
<link rel="icon" href="icon.svg">
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
  #screen { position: absolute; left: 0; top: 0; display: block; background: #000; image-rendering: pixelated; }
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #arcade {
    position: absolute; z-index: 3; left: 8px; top: 8px; padding: 8px 10px;
    color: #ffb8ae; font-size: 12px; line-height: 1; letter-spacing: .06em; text-decoration: none;
    opacity: .7; border-radius: 6px; white-space: nowrap;
  }
  #arcade:hover, #arcade:focus-visible { opacity: 1; background: rgba(33, 33, 222, .25); outline: none; }
  body.playing #arcade { display: none; }
  .btn {
    position: absolute; z-index: 3; width: 40px; height: 40px; padding: 0; margin: 0;
    border: 2px solid #2121de; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #ffb8ae;
    display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: .7;
    touch-action: manipulation;
  }
  .btn:hover, .btn:focus-visible { opacity: 1; outline: none; }
  .btn svg { width: 20px; height: 20px; display: block; }
  #btn-mute .off { display: none; }
  #btn-mute[aria-pressed="true"] .on { display: none; }
  #btn-mute[aria-pressed="true"] .off { display: block; }
  body.touch .btn { width: 46px; height: 46px; }
  #dpad { position: absolute; z-index: 2; display: none; touch-action: none; }
  body.has-pad #dpad { display: block; }
  #dpad svg { width: 100%; height: 100%; display: block; }
  #dpad .cross { fill: rgba(33, 33, 222, .2); stroke: #2121de; stroke-width: 1.6; stroke-linejoin: round; }
  #dpad .arm { fill: transparent; }
  #dpad .hub { fill: none; stroke: rgba(33, 33, 222, .7); stroke-width: 1.2; }
  #dpad .arrow { fill: #ffb8ae; opacity: .8; }
  #dpad[data-dir="up"] .arm.up, #dpad[data-dir="down"] .arm.down,
  #dpad[data-dir="left"] .arm.left, #dpad[data-dir="right"] .arm.right { fill: rgba(33, 33, 222, .65); }
  noscript { color: #fff; position: absolute; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<canvas id="screen" width="224" height="288" aria-label="Pac-Man game screen"></canvas>
<div id="safe"></div>
<a id="arcade" href="https://open-arcade.up.railway.app">&larr; Arcade</a>
<button id="btn-pause" class="btn" type="button" aria-label="Pause" title="Pause (P)">
  <svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
</button>
<button id="btn-mute" class="btn" type="button" aria-label="Mute" aria-pressed="false" title="Sound (M)">
  <svg class="on" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.5 5a7 7 0 0 1 0 10"/></svg>
  <svg class="off" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.5l5 5M18 7.5l-5 5"/></svg>
</button>
<div id="dpad" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <path class="cross" d="M35 3H65V35H97V65H65V97H35V65H3V35H35Z"/>
    <rect class="arm up" x="36" y="4" width="28" height="31" rx="2"/>
    <rect class="arm down" x="36" y="65" width="28" height="31" rx="2"/>
    <rect class="arm left" x="4" y="36" width="31" height="28" rx="2"/>
    <rect class="arm right" x="65" y="36" width="31" height="28" rx="2"/>
    <circle class="hub" cx="50" cy="50" r="7"/>
    <path class="arrow" d="M50 11L58 23H42Z"/>
    <path class="arrow" d="M50 89L58 77H42Z"/>
    <path class="arrow" d="M11 50L23 42V58Z"/>
    <path class="arrow" d="M89 50L77 42V58Z"/>
  </svg>
</div>
<noscript>Pac-Man needs JavaScript.</noscript>
<script src="js/data.js"></script>
<script src="js/maze.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
