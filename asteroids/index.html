<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="description" content="Asteroids: a faithful remake of Atari's 1979 vector arcade game, with glowing vector lines, synthesised sound and on-screen controls for phones.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Asteroids</title>
<link rel="icon" href="icon.svg">
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { position: fixed; inset: 0; color: #fff; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
  #screen { position: absolute; left: 0; top: 0; display: block; background: #000; touch-action: none; }
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  #arcade {
    position: fixed; z-index: 4; display: none;
    left: calc(6px + env(safe-area-inset-left, 0px)); bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    padding: 8px 10px; border-radius: 6px;
    color: #cfd8ff; font-size: 12px; line-height: 1; letter-spacing: .08em; text-decoration: none;
    opacity: .55; white-space: nowrap;
  }
  #arcade:hover, #arcade:focus-visible { opacity: 1; background: rgba(255, 255, 255, .08); outline: none; }
  body.menu #arcade { display: block; }

  #btns {
    position: fixed; z-index: 4; display: flex; flex-direction: row-reverse; gap: 8px;
    top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px));
  }
  .btn {
    width: 38px; height: 38px; padding: 0; margin: 0; border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .45); background: rgba(0, 0, 0, .5); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: .6;
    touch-action: manipulation; box-shadow: 0 0 6px rgba(190, 215, 255, .18);
  }
  .btn:hover, .btn:focus-visible { opacity: 1; outline: none; }
  .btn svg { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  body.touch .btn { width: 42px; height: 42px; }
  #btn-pause { display: none; }
  body.ingame #btn-pause { display: flex; }
  #btn-trails { display: none; }
  body.menu #btn-trails { display: flex; }
  #btn-trails[aria-pressed="true"] { opacity: .95; border-color: #fff; }
  #btn-mute .off { display: none; }
  #btn-mute[aria-pressed="true"] .on { display: none; }
  #btn-mute[aria-pressed="true"] .off { display: block; }
  #btn-pause .play { display: none; }
  body.paused #btn-pause .pause { display: none; }
  body.paused #btn-pause .play { display: block; }

  #pad { position: fixed; inset: 0; z-index: 3; pointer-events: none; display: none; }
  body.pad #pad { display: block; }
  .pb {
    position: absolute; box-sizing: border-box; border-radius: 50%; pointer-events: auto; touch-action: none;
    border: 2px solid rgba(255, 255, 255, .5); background: rgba(255, 255, 255, .035); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 9px rgba(190, 215, 255, .22), inset 0 0 9px rgba(190, 215, 255, .12);
    transition: background-color .05s, box-shadow .05s;
  }
  .pb.on { background: rgba(255, 255, 255, .2); border-color: #fff; box-shadow: 0 0 16px rgba(190, 215, 255, .7), inset 0 0 12px rgba(190, 215, 255, .4); }
  .pb svg { width: 46%; height: 46%; display: block; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 2px rgba(190, 215, 255, .8)); }
  .pb span { font-size: 9px; line-height: 1; letter-spacing: .14em; margin-top: 3px; opacity: .72; }
  noscript { color: #fff; position: absolute; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body class="menu">
<canvas id="screen" width="1024" height="768" aria-label="Asteroids game screen"></canvas>
<div id="safe"></div>
<a id="arcade" href="https://open-arcade.up.railway.app">&larr; Arcade</a>
<div id="btns">
  <button id="btn-mute" class="btn" type="button" aria-label="Mute" aria-pressed="false" title="Sound (M)">
    <svg class="on" viewBox="0 0 20 20"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.5 5a7 7 0 0 1 0 10"/></svg>
    <svg class="off" viewBox="0 0 20 20"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.5l5 5M18 7.5l-5 5"/></svg>
  </button>
  <button id="btn-pause" class="btn" type="button" aria-label="Pause" title="Pause (P)">
    <svg class="pause" viewBox="0 0 20 20"><path d="M7 4v12M13 4v12"/></svg>
    <svg class="play" viewBox="0 0 20 20"><path d="M7 4l9 6-9 6z"/></svg>
  </button>
  <button id="btn-trails" class="btn" type="button" aria-label="Phosphor trails" aria-pressed="false" title="Phosphor trails (T)">
    <svg viewBox="0 0 20 20"><circle cx="14.5" cy="5.5" r="2.2"/><path d="M12.6 7.4L4 16M10.6 5.6L5 11.2M14.4 9.4L8.8 15"/></svg>
  </button>
</div>
<div id="pad" aria-hidden="true">
  <div class="pb" data-btn="left"><svg viewBox="0 0 40 40"><path d="M27 9L11 20l16 11z"/></svg></div>
  <div class="pb" data-btn="right"><svg viewBox="0 0 40 40"><path d="M13 9l16 11-16 11z"/></svg></div>
  <div class="pb" data-btn="hyper"><svg viewBox="0 0 40 40"><path d="M20 4v6M20 30v6M4 20h6M30 20h6M9 9l4 4M27 27l4 4M31 9l-4 4M13 27l-4 4"/><circle cx="20" cy="20" r="3"/></svg><span>HYPER</span></div>
  <div class="pb" data-btn="thrust"><svg viewBox="0 0 40 40"><path d="M20 4L30 27M20 4L10 27M12.5 22h15M16 22l4 12 4-12"/></svg><span>THRUST</span></div>
  <div class="pb" data-btn="fire"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="3.5" fill="#fff"/><path d="M20 5v6M20 29v6M5 20h6M29 20h6"/></svg><span>FIRE</span></div>
</div>
<noscript>Asteroids needs JavaScript.</noscript>
<script src="js/font.js"></script>
<script src="js/shapes.js"></script>
<script src="js/scores.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
